[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "niub-mall"
version = "0.1.0"
description = "Catalog and HTTP API for Niub Shangcheng."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pymysql>=1.1",
    "python-dotenv>=1.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[tool.setuptools.packages.find]
where = ["src"]

