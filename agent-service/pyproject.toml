[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "niub-agent-service"
version = "0.1.0"
description = "HTTP service for the Niub Shangcheng assistant."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "openai>=3,<4",
    "pyyaml>=6",
    "python-dotenv>=1.2",
    "uvicorn[standard]>=0.34",
]

[tool.setuptools.packages.find]
where = ["src"]

